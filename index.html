<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凉爽 · 个人主页</title>
<style>
  :root {
    --ink: #1f2933;
    --ink-soft: #52606d;
    --accent: #0f766e;
    --line: #e4e7eb;
    --bg: #fafbfc;
    --card: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.75;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  header { padding: 96px 0 64px; }
  .avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, #0f766e, #14b8a6);
    color: #fff; font-size: 32px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  h1 { font-size: 2.4rem; font-weight: 700; letter-spacing: 0.02em; }
  .tagline { color: var(--ink-soft); font-size: 1.15rem; margin-top: 10px; }
  .divider { border: none; border-top: 1px solid var(--line); margin: 0; }
  section { padding: 48px 0; }
  h2 {
    font-size: 1.05rem; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 20px;
  }
  section p { color: var(--ink-soft); }
  .items { display: flex; flex-direction: column; gap: 16px; }
  .item {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 22px;
  }
  .item strong { display: block; font-size: 1.02rem; margin-bottom: 4px; }
  .item span { color: var(--ink-soft); font-size: 0.95rem; }
  footer {
    padding: 40px 0 64px; color: #9aa5b1; font-size: 0.88rem;
    border-top: 1px solid var(--line); margin-top: 16px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  @media (max-width: 520px) {
    header { padding: 64px 0 40px; }
    h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>
  <header class="wrap">
    <div class="avatar">凉</div>
    <h1>凉爽</h1>
    <p class="tagline">折腾自动化 · 让机器多干活，让自己少操心</p>
  </header>

  <hr class="divider">

  <section class="wrap">
    <h2>我是谁</h2>
    <p>
      我是凉爽，一个相信"能自动的事就不手动"的人。日常泡在 Windows 环境里，
      和脚本、命令行、AI 助手打交道，习惯把重复的活儿交给工具。
    </p>
  </section>

  <section class="wrap">
    <h2>我在做什么</h2>
    <div class="items">
      <div class="item">
        <strong>个人环境自动化</strong>
        <span>把常用工具和网址配置成开机自启、定时任务，让登录后的第一分钟就是就绪状态。</span>
      </div>
      <div class="item">
        <strong>AI 助手协作</strong>
        <span>用 WorkBuddy 等智能体工具管理文件、跑命令、写代码，探索人机分工的最佳边界。</span>
      </div>
      <div class="item">
        <strong>知识沉淀</strong>
        <span>把踩过的坑和验证过的方案记进知识库，下次遇到同类问题直接翻答案。</span>
      </div>
    </div>
  </section>

  <footer class="wrap">
    <p>本页由薄荷（Mint）🍃 生成 · 部分介绍暂基于本地档案，详细资料待知识库接入后补充。</p>
  </footer>
</body>
</html>
